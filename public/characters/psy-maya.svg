<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 920" width="440" height="920" role="img" aria-label="Dr. Maya, psychology professor, full length">
  <title>Dr. Maya</title>

  <style>
    .hair    { fill: #4A2B20; }
    .hair-lt { fill: #6B4030; }
    .skin    { fill: #C4834F; }
    .skin-dk { fill: #A96A3C; }
    .coat    { fill: #2E7D3A; }
    .coat-lt { fill: #37913F; }
    .bib     { fill: #26702E; }
    .pant    { fill: #24692E; }
    .shoe    { fill: #1C5A2A; }
    .knit    { fill: #F5F0E1; }
    .slate   { fill: #22262B; }
    .dark    { fill: #2A1A12; }
    .bloom   { fill: #F2A0B5; }
  </style>

  <!-- hair: tall asymmetric sweep, wider than the shoulders -->
  <g class="hair">
    <ellipse cx="212" cy="186" rx="146" ry="142"/>
    <circle cx="168" cy="112" r="88"/>
    <circle cx="296" cy="186" r="82"/>
    <circle cx="112" cy="248" r="62"/>
    <circle cx="316" cy="268" r="56"/>
  </g>
  <g class="hair-lt" opacity=".55">
    <ellipse cx="176" cy="118" rx="66" ry="44" transform="rotate(-26 176 118)"/>
    <ellipse cx="234" cy="76" rx="44" ry="28" transform="rotate(-12 234 76)"/>
  </g>

  <!-- wide cropped trousers -->
  <path class="pant" d="M128 466h96c2 96 0 244-2 386h-98c-6-142-4-290 4-386Z"/>
  <path class="pant" d="M232 466h96c8 96 10 244 4 386h-98c-2-142-4-290-2-386Z"/>

  <!-- loafers, both turned out -->
  <rect class="shoe" x="-52" y="-24" width="104" height="48" rx="22" transform="translate(172 862) rotate(-9)"/>
  <rect class="shoe" x="-52" y="-24" width="104" height="48" rx="22" transform="translate(288 864) rotate(8)"/>

  <!-- neck -->
  <rect class="skin-dk" x="212" y="308" width="46" height="50" rx="17"/>

  <!-- knit panel down the chest -->
  <path class="knit" d="M190 344h64c4 44 6 92 5 136h-74c-1-44 1-92 5-136Z"/>
  <rect class="knit" x="188" y="322" width="70" height="52" rx="24"/>

  <!-- overall bib over the knit, straps up to the shoulders -->
  <rect class="bib" x="-11" y="-42" width="22" height="84" rx="10" transform="translate(202 400) rotate(-5)"/>
  <rect class="bib" x="-11" y="-42" width="22" height="84" rx="10" transform="translate(244 398) rotate(4)"/>
  <path class="bib" d="M188 430h68c3 34 4 70 4 104h-76c0-34 1-70 4-104Z"/>

  <!-- cardigan: two panels leaving the middle open -->
  <path class="coat" d="M196 352c-38 4-62 20-70 44-10 28-15 70-15 102 0 28 2 54 5 76h80c-4-72-4-152 0-222Z"/>
  <path class="coat" d="M248 352c38 4 62 20 70 44 10 28 15 70 15 102 0 28-2 54-5 76h-80c4-72 4-152 0-222Z"/>

  <!-- flower brooch -->
  <g transform="translate(178 392)">
    <circle class="bloom" cx="0" cy="-12" r="10"/>
    <circle class="bloom" cx="11" cy="-4" r="10"/>
    <circle class="bloom" cx="7" cy="10" r="10"/>
    <circle class="bloom" cx="-7" cy="10" r="10"/>
    <circle class="bloom" cx="-11" cy="-4" r="10"/>
    <circle fill="#F2C14E" cx="0" cy="0" r="6.5"/>
  </g>

  <!-- far arm hangs -->
  <path fill="none" stroke="#37913F" stroke-width="42" stroke-linecap="round" d="M308 396c14 58 20 122 20 164"/>
  <rect class="skin" x="-18" y="-16" width="36" height="32" rx="16" transform="translate(330 582) rotate(8)"/>

  <!-- tablet clamped against her hip -->
  <rect class="slate" x="-40" y="-52" width="80" height="104" rx="10" transform="translate(152 494) rotate(-8)"/>
  <rect fill="#3A4048" x="-29" y="-41" width="58" height="78" rx="5" transform="translate(152 494) rotate(-8)"/>

  <!-- near arm: down the side, then across to clamp the tablet -->
  <path fill="none" stroke="#37913F" stroke-width="44" stroke-linecap="round" d="M140 394c-12 28-16 54-14 74"/>
  <path fill="none" stroke="#37913F" stroke-width="40" stroke-linecap="round" d="M126 468c16 22 38 34 60 40"/>
  <rect class="skin" x="-18" y="-15" width="36" height="30" rx="15" transform="translate(194 512) rotate(14)"/>

  <!-- head -->
  <g transform="rotate(-2 222 240)">
    <rect class="skin" x="142" y="146" width="170" height="186" rx="78"/>
    <circle class="knit" cx="154" cy="296" r="9"/>
    <circle class="knit" cx="302" cy="288" r="9"/>

    <!-- the sweep dips across the forehead -->
    <g class="hair">
      <ellipse cx="188" cy="152" rx="62" ry="46"/>
      <ellipse cx="266" cy="150" rx="52" ry="42"/>
      <circle cx="146" cy="206" r="32"/>
      <circle cx="308" cy="200" r="28"/>
    </g>

    <!-- heavy calm lids -->
    <ellipse cx="196" cy="256" rx="26" ry="27" fill="#fff"/>
    <ellipse cx="268" cy="252" rx="26" ry="27" fill="#fff"/>
    <ellipse class="dark" cx="200" cy="254" rx="15" ry="17"/>
    <ellipse class="dark" cx="272" cy="250" rx="15" ry="17"/>
    <circle cx="194" cy="246" r="6" fill="#fff"/>
    <circle cx="266" cy="242" r="6" fill="#fff"/>
    <ellipse class="skin" cx="196" cy="234" rx="32" ry="24"/>
    <ellipse class="skin" cx="268" cy="230" rx="32" ry="24"/>
    <rect class="hair" x="-27" y="-6.5" width="54" height="13" rx="6.5" transform="translate(192 214) rotate(-8)"/>
    <rect class="hair" x="-27" y="-6.5" width="54" height="13" rx="6.5" transform="translate(272 208) rotate(6)"/>

    <path class="skin-dk" d="M248 280c6 8 8 16 3 19s-14 1-16-5 7-11 13-14Z"/>
    <path fill="none" stroke="#8A4A2E" stroke-width="7" stroke-linecap="round" d="M226 308c11 12 30 11 40-3"/>
  </g>
</svg>
