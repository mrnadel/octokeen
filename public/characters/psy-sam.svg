<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 600 496" width="600" height="496" role="img" aria-label="Sam, curious psychology student">
  <title>Sam</title>

  <style>
    .hair    { fill: #6B4429; }
    .hair-dk { fill: #573520; }
    .skin    { fill: #E0A87A; }
    .skin-dk { fill: #C4855A; }
    .hood    { fill: #F4791F; }
    .hood-dk { fill: #CE5F0E; }
    .hood-lt { fill: #FF9D4D; }
    .cap-dk  { fill: #C25708; }
    .can     { fill: #2E2E33; }
    .can-lt  { fill: #4B4B55; }
    .cord    { fill: #F7EEDF; }
    .dark    { fill: #2B1A10; }
  </style>

  <ellipse cx="300" cy="292" rx="204" ry="208" fill="#FFE7BC"/>

  <!-- body -->
  <g transform="rotate(3 300 470)">

    <!-- hood bunched behind the shoulders -->
    <rect class="hood-lt" x="222" y="340" width="156" height="68" rx="34"/>

    <!-- headphone band, passes behind the neck -->
    <path fill="none" stroke="#2E2E33" stroke-width="19" stroke-linecap="round"
          d="M256 392C256 344 256 322 302 322 348 322 348 344 348 392"/>

    <rect class="skin-dk" x="278" y="312" width="44" height="60" rx="18"/>

    <path class="hood" d="M300 366c-38 0-66 18-74 50-6 26 8 56 10 86 2 36-10 66-18 122h164c-8-56-20-86-18-122 2-30 16-60 10-86-8-32-36-50-74-50Z"/>

    <!-- hood opening at the throat -->
    <path class="hood-dk" d="M271 374c8 17 17 29 29 37 12-8 21-20 29-37-8-5-18-8-29-8s-21 3-29 8Z"/>

    <!-- drawstrings -->
    <path fill="none" stroke="#F7EEDF" stroke-width="9" stroke-linecap="round" d="M286 410c-4 26-6 52-4 76"/>
    <path fill="none" stroke="#F7EEDF" stroke-width="9" stroke-linecap="round" d="M314 410c5 25 8 50 8 72"/>
    <rect class="cord" x="274" y="480" width="16" height="26" rx="8"/>
    <rect class="cord" x="314" y="476" width="16" height="26" rx="8"/>


    <!-- his right arm: thrown up and out, open palm -->
    <path fill="none" stroke="#F4791F" stroke-width="46" stroke-linecap="round" d="M236 430c-28 16-50 38-64 62"/>
    <path fill="none" stroke="#F4791F" stroke-width="42" stroke-linecap="round" d="M172 492c-16-30-24-62-24-92"/>
    <rect class="skin" x="-24" y="-21" width="48" height="42" rx="21" transform="translate(146 370) rotate(-12)"/>
    <rect class="skin" x="-13" y="-9" width="26" height="18" rx="9" transform="translate(170 352) rotate(-52)"/>

    <!-- his left arm: dropped low and wide, palm turned up -->
    <path fill="none" stroke="#CE5F0E" stroke-width="46" stroke-linecap="round" d="M372 450c28 18 50 40 60 66"/>
    <path fill="none" stroke="#CE5F0E" stroke-width="42" stroke-linecap="round" d="M432 516c16-12 34-20 50-24"/>
    <rect class="skin-dk" x="-24" y="-21" width="48" height="42" rx="21" transform="translate(492 482) rotate(20)"/>
    <rect class="skin-dk" x="-13" y="-9" width="26" height="18" rx="9" transform="translate(474 466) rotate(-42)"/>

    <!-- headphone cups either side of the neck -->
    <rect class="can" x="226" y="359" width="52" height="66" rx="24"/>
    <rect class="can-lt" x="237" y="373" width="30" height="40" rx="15"/>
    <rect class="can" x="322" y="359" width="52" height="66" rx="24"/>
    <rect class="can-lt" x="333" y="373" width="30" height="40" rx="15"/>
  </g>

  <!-- head -->
  <g transform="rotate(-6 300 246)">

    <g class="hair-dk">
      <rect x="188" y="206" width="48" height="88" rx="24"/>
      <rect x="364" y="206" width="48" height="88" rx="24"/>
      <circle cx="300" cy="206" r="70"/>
      <circle cx="246" cy="220" r="46"/>
      <circle cx="354" cy="220" r="46"/>
    </g>

    <circle class="skin" cx="202" cy="262" r="19"/>
    <circle class="skin" cx="398" cy="262" r="19"/>
    <rect class="skin" x="207" y="148" width="186" height="196" rx="80"/>

    <!-- beanie, slouched back off the forehead -->
    <g transform="rotate(11 302 182)">
      <path class="hood" d="M214 196C214 144 252 112 300 112 348 112 386 144 386 196Z"/>
      <circle class="hood" cx="344" cy="150" r="24"/>
      
      <rect class="cap-dk" x="206" y="168" width="188" height="36" rx="18"/>
    </g>

    <!-- messy fringe spilling out from under the brim -->
    <g class="hair">
      <circle cx="246" cy="196" r="26"/>
      <circle cx="296" cy="200" r="26"/>
      <circle cx="340" cy="200" r="25"/>
      <circle cx="218" cy="204" r="21"/>
      <circle cx="374" cy="208" r="21"/>
      <rect x="-9" y="-22" width="18" height="44" rx="9" transform="translate(234 186) rotate(-36)"/>
      <rect x="-8" y="-20" width="16" height="40" rx="8" transform="translate(268 196) rotate(-12)"/>
      <rect x="-8" y="-20" width="16" height="40" rx="8" transform="translate(316 200) rotate(14)"/>
    </g>

    <!-- eyes -->
    <ellipse cx="260" cy="270" rx="26" ry="27" fill="#fff"/>
    <ellipse cx="340" cy="270" rx="26" ry="27" fill="#fff"/>
    <ellipse class="dark" cx="263" cy="269" rx="14" ry="17"/>
    <ellipse class="dark" cx="343" cy="269" rx="14" ry="17"/>
    <circle cx="257" cy="259" r="6" fill="#fff"/>
    <circle cx="333" cy="259" r="6" fill="#fff"/>
    <ellipse class="skin" cx="260" cy="238" rx="33" ry="21"/>
    <ellipse class="skin" cx="340" cy="238" rx="33" ry="21"/>
    <rect class="hair" x="-22" y="-5.5" width="44" height="11" rx="5.5" transform="translate(256 232) rotate(-11)"/>
    <rect class="hair" x="-22" y="-5.5" width="44" height="11" rx="5.5" transform="translate(344 230) rotate(9)"/>

    <path class="skin-dk" d="M300 284c7 7 9 15 4 19s-16 2-18-4 7-12 14-15Z"/>
    <path class="dark" d="M259 309c22 5 44 5 66 0 1 15-14 27-33 27s-34-12-33-27Z"/>
    <path fill="#FFFDF7" d="M261 311c21 4 41 4 62 0 0 5-1 8-2 9-19 4-39 4-58 0-1-1-2-4-2-9Z"/>
  </g>
</svg>
